        <!-- INFO SCREEN -->

        <section id="info-screen" class="info-screen">

            <h1 id="info-title"></h1>

            <p id="info-text"></p>

            <button id="info-next" class="next-button">
                CONTINUAR
            </button>

        </section>


        <!-- QUESTION SCREEN -->

        <section class="question">

            <p class="question-number" id="question-number"></p>

            <h1 id="question-text"></h1>
            <pre id="question-code"></pre>
            
            <textarea id="code-editor" placeholder="Escribe tu código aquí..."></textarea>

            <div class="answers">

                <button class="answer" id="answer-1"></button>

                <button class="answer" id="answer-2"></button>

                <button class="answer" id="answer-3"></button>

                <button class="answer" id="answer-4"></button>

            </div>

            
        </section>


        <!-- FEEDBACK MESSAGE -->
        <div id="question-feedback" class="question-feedback" style="display: none;" role="alert"></div>

        <button class="check-button" onclick="checkAnswer()">
            COMPROBAR
        </button>

    <!-- GAME OVER SCREEN -->

<section id="game-over-screen" class="game-over-screen">

    <div class="game-over-content">

        <h1>¡Te quedaste sin vidas!</h1>

        <p>Has agotado tus vidas en esta lección.</p>

        <button id="retry-button" class="retry-button">
            REINTENTAR
        </button>

        <button id="exit-button" class="exit-button">
            SALIR DE LA LECCIÓN
        </button>

    </div>

</section>


<!-- COMPLETION SCREEN -->

<section id="completion-screen" class="completion-screen" style="display: none;">

    <div class="completion-content">
        <img src="/assets/kodicode-mascot-BOs5CTBs.png" alt="KodiCode" class="completion-mascot" style="width: 80px; height: 80px; margin-bottom: 10px; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));">
        <h1>¡Lección Completada!</h1>

        <p class="xp-reward">+25 XP</p>

        <button onclick="goBackToCourse()">
            CONTINUAR
        </button>
    </div>

</section>




    </main>
